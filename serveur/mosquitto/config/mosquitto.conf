# ── Persistence ───────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Logs ──────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

# ── Listener non sécurisé (localhost uniquement) ──────
# Utilisé uniquement pour les tests internes entre conteneurs
listener 1883 127.0.0.1
allow_anonymous true

# ── Listener sécurisé TLS 1.3 ─────────────────────────
listener 8883

# Certificats
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server/mosquitto.crt
keyfile /mosquitto/certs/server/mosquitto.key

# Authentification mutuelle obligatoire
require_certificate true
use_identity_as_username true

# TLS version minimale
tls_version tlsv1.3

# Pas d'accès anonyme sur le port sécurisé
allow_anonymous false

# ── Limites ────────────────────────────────────────────
max_connections 1000
max_inflight_messages 100
max_queued_messages 1000

# ── QoS 2 ─────────────────────────────────────────────
# Garantir la livraison exactement une fois
max_inflight_bytes 0
max_queued_bytes 0
