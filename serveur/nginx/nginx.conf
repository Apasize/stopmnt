events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    limit_req_zone $binary_remote_addr zone=api:10m  rate=120r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    server {
        listen 8080;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Fichiers statiques React
        root  /usr/share/nginx/html;
        index index.html;

        # API — proxy vers FastAPI
        location /api/ {
            limit_req zone=api burst=60 nodelay;
            set $upstream fastapi;
            proxy_pass         http://$upstream:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /api/v1/auth/login {
            limit_req zone=auth burst=5 nodelay;
            set $upstream fastapi;
            proxy_pass         http://$upstream:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /health {
            set $upstream fastapi;
            proxy_pass http://$upstream:8000/health;
        }

        # React Router — toutes les routes non-API retournent index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
