services:

  # ── Broker MQTT ──────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: stopmnt-mosquitto
    restart: unless-stopped
    ports:
      - "8883:8883"
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - stopmnt-internal

  # ── Time-series database ──────────────────────────────
  influxdb:
    image: influxdb:2.7
    container_name: stopmnt-influxdb
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - ./influxdb/data:/var/lib/influxdb2
      - ./influxdb/config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USERNAME}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}
      - DOCKER_INFLUXDB_INIT_RETENTION=2160h
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - stopmnt-internal

  # ── Base relationnelle ────────────────────────────────
  postgres_primary:
    image: postgres:16-alpine
    container_name: stopmnt-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - stopmnt-internal

  nginx:
    image: nginx:alpine
    container_name: stopmnt-nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/logs:/var/log/nginx
      - ./web:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "--cacert", "/etc/nginx/certs/ca.crt",
             "https://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      fastapi:
        condition: service_healthy
    networks:
      - stopmnt-internal


  # ── Cache et queues ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: stopmnt-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./redis/data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - stopmnt-internal

  # ── API Gateway ───────────────────────────────────────
  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    container_name: stopmnt-fastapi
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - POSTGRES_HOST=postgres_primary
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - JWT_EXPIRE_HOURS=${JWT_EXPIRE_HOURS}
      - CA_CERT_PATH=/certs/ca.crt
      - CA_KEY_PATH=/certs/ca.key
    volumes:
      - ./certs/ca:/certs:ro
    depends_on:
      postgres_primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - stopmnt-internal

  # ── Worker MQTT + alertes ─────────────────────────────
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: stopmnt-worker
    restart: unless-stopped
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=8883
      - MQTT_CA_CERT=/certs/ca.crt
      - MQTT_CERT=/certs/worker.crt
      - MQTT_KEY=/certs/worker.key
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - POSTGRES_HOST=postgres_primary
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - GOOGLE_APPLICATION_CREDENTIALS=/firebase/service-account.json
    volumes:
      - ./certs/ca/ca.crt:/certs/ca.crt:ro
      - ./certs/clients/worker/worker.crt:/certs/worker.crt:ro
      - ./certs/clients/worker/worker.key:/certs/worker.key:ro
      - ./firebase/service-account.json:/firebase/service-account.json:ro
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      postgres_primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stopmnt-internal

  grafana:
    image: grafana/grafana:latest
    container_name: stopmnt-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://${SERVER_IP}:3000
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      influxdb:
        condition: service_healthy
      postgres_primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - stopmnt-internal

  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: stopmnt-backup
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres_primary
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
    volumes:
      - ./data/backups:/backups
    depends_on:
      postgres_primary:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    networks:
      - stopmnt-internal

networks:
  stopmnt-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
